# ==========================================
# Server
# ==========================================
server.port=8083
spring.application.name=rag-service


# ==========================================
# PostgreSQL
# ==========================================
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/rag_vector
spring.datasource.username=postgres
spring.datasource.password=Vamshi@1309



# ==========================================
# Ollama
# ==========================================
spring.ai.ollama.base-url=http://host.docker.internal:11434
spring.ai.ollama.chat.options.model=llama3.2:3b
spring.ai.ollama.embedding.options.model=nomic-embed-text


# ==========================================
# PGVector
# ==========================================
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=ollama_vector_store
spring.ai.vectorstore.pgvector.dimensions=768


# ==========================================
# Eureka
# ==========================================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
