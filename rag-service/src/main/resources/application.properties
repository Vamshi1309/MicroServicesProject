# ==========================================
# Server
# ==========================================
server.port=8083
spring.application.name=rag-service

# Maximum size of a single uploaded file
spring.servlet.multipart.max-file-size=50MB

# Maximum total size of the multipart request
spring.servlet.multipart.max-request-size=50MB

# ==========================================
# PostgreSQL
# ==========================================
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/rag_vector
spring.datasource.username=postgres
spring.datasource.password=Vamshi@1309

# Ollama
spring.ai.ollama.base-url=http://host.docker.internal:11434
spring.ai.ollama.chat.model=llama3.2:3b
spring.ai.ollama.embedding.model=nomic-embed-text


# ==========================================
# PGVector
# ==========================================
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=ollama_vector_store
spring.ai.vectorstore.pgvector.dimensions=768


# ==========================================
# Eureka
# ==========================================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Kafka configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer deserialization
spring.kafka.consumer.group-id=rag-document-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Trust the event package for JSON deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ragplatform.rag_service.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.ragplatform.rag_service.events.DocumentUploadedEvent
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.properties.spring.json.use.type.headers=false

app.kafka.topics.document-uploaded=document-uploaded
