server.port=8082
spring.application.name=document-service

spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/rag_document
spring.datasource.username=postgres
spring.datasource.password=Vamshi@1309

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

rag.service.url=http://rag-service:8083

# Kafka configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.kafka.topics.document-uploaded=document-uploaded
app.kafka.topics.document-ingestion-status=document-ingestion-status

# Kafka Consumer - Document Ingestion Status
spring.kafka.consumer.group-id=document-status-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.ragplatform.document.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.ragplatform.document.events.DocumentIngestionStatusEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false